[project]
name = "docket"
version = "0.1.0"
description = "Marks handwritten exam scripts with two vision readers, decides marks in code, and issues KMS-signed credentials that are re-issued when the marking scheme changes."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "strands-agents>=1.63.0",
  "boto3>=1.43",
  "pydantic>=2.14",
  "google-genai>=2.34",
  "openai>=3.45",
  "cryptography>=46",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docket = "docket.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
