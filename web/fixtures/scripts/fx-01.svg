<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760"><rect width="800" height="760" fill="#fbfaf5"/><line x1="20" x2="780" y1="100" y2="100" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="146" y2="146" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="192" y2="192" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="238" y2="238" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="284" y2="284" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="330" y2="330" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="376" y2="376" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="422" y2="422" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="468" y2="468" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="514" y2="514" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="560" y2="560" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="606" y2="606" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="652" y2="652" stroke="#c9d3e8" stroke-width="1"/><line x1="20" x2="780" y1="698" y2="698" stroke="#c9d3e8" stroke-width="1"/><text x="40" y="50" font-family="monospace" font-size="18" fill="#9a3b1b">FIXTURE fx-01: stand-in for a scanned script</text><text x="40" y="90" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1f2a5a">a) 2cos²x − cos x − 1 = 0</text><text x="40" y="136" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1f2a5a">cos x = 1 or cos x = −1/2</text><text x="40" y="182" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1f2a5a">x = 2πk, x = ±2π/3 + 2πk</text><text x="40" y="228" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1f2a5a">b) on [−3π; −3π/2]:</text><text x="40" y="274" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1f2a5a">x = −8π/3</text></svg>